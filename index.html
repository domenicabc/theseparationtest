<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Separation Test</title><style>
:root{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;color:#eae9e5;background:#101112}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:48px 22px 90px}.eyebrow{font-size:12px;letter-spacing:.19em;color:#a4a5a5;text-transform:uppercase}.hero{padding:40px 0 32px;border-bottom:1px solid #393b3d}h1{font-size:clamp(38px,8vw,94px);letter-spacing:.015em;line-height:1.06;margin:20px 0}h1 em{font-family:inherit;font-style:normal;font-weight:400;color:#d6d5d0}p{color:#b4b5b5;line-height:1.65;max-width:680px}.search{display:flex;gap:8px;margin-top:28px}input{background:#222426;border:1px solid #64676b;color:white;padding:17px;font-size:17px;border-radius:4px;flex:1;min-width:0}button{background:#eae9e5;color:#171819;border:0;border-radius:4px;padding:14px 22px;font-weight:700;cursor:pointer}button:hover{background:#ffffff}button:disabled{opacity:.6;cursor:wait} .reflection ol{padding-left:22px}.reflection li{margin:12px 0;overflow-wrap:anywhere} .reflection a{color:#deddd8}.hint{font-size:12px;color:#939598;margin-top:12px}.result{margin-top:40px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.top h2{font-size:42px;letter-spacing:.005em;line-height:1.18;margin:10px 0}.tag{border:1px solid #5b5e62;padding:8px 12px;border-radius:99px;color:#d6d6d4;font-size:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:25px 0}.card{border:1px solid #3a3d40;border-radius:7px;padding:25px;background:#1b1d1f}.card h3{margin:0 0 14px;font-size:15px}.score{font-size:64px;font-weight:750;letter-spacing:.025em;font-variant-numeric:tabular-nums lining-nums;line-height:1.2}.score small{font-size:19px;color:#939598;letter-spacing:.035em;font-weight:400}.bar{height:9px;background:#383b3e;border-radius:10px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;background:#659e79}.card li{margin:0 0 13px;color:#d0d0cd;line-height:1.5}.card ul{padding-left:19px}.verdict{background:#222426;padding:28px;border-left:4px solid #d9aa55;border-radius:4px}.verdict h3{color:#d9aa55;font-size:27px;margin:10px 0}.verdict p{margin-bottom:0}.reflection{margin-top:16px;border:1px solid #3a3d40;border-radius:5px;padding:26px 28px;background:#1b1d1f}.reflection h3{font-size:19px;font-weight:500;letter-spacing:.01em;margin:12px 0}.reflection p{margin:10px 0 0}.hidden{display:none}.note{margin-top:25px;font-size:12px;color:#939598}.error{border:1px solid #626569;border-radius:5px;padding:25px;margin-top:25px}a{color:#eae9e5}@media(max-width:680px){.cards{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.search{flex-direction:column}button{width:100%}}
</style></head><body><main><div class="eyebrow">An experiment in art, ethics & influence</div><section class="hero"><h1>“THE<br><em>SEPARATION</em><br>TEST”</h1><p>Can you separate the work from the person? Explore cultural contribution, documented ethical conduct, and what your support actually enables.</p><form class="search" id="search"><input id="name" placeholder="Search a public figure…" aria-label="Public figure's name" required><button>Examine →</button></form><div class="hint">Live research beta · Shared results are saved for 24 hours · Public figures only.</div></section><section id="status" class="error hidden" role="status"></section><section id="result" class="result hidden" aria-live="polite"></section></main>
<script>
const form=document.getElementById('search'),input=document.getElementById('name'),result=document.getElementById('result'),status=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const color=n=>n<25?'#c95151':n<45?'#d97c52':n<60?'#d9aa55':n<80?'#a5b76a':'#659e79';
function scoreCard(title,score,items){let n=Number.isFinite(Number(score))?Math.max(0,Math.min(100,Number(score))):null;return `<section class="card"><h3>${esc(title)}</h3><div class="score" style="color:${n===null?'#a4a5a5':color(n)}">${n===null?'N/A':n}<small>${n===null?'':' / 100'}</small></div><div class="bar"><div class="fill" style="width:${n??0}%;background:${n===null?'#777':color(n)}"></div></div><ul>${(items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`}
form.addEventListener('submit',async e=>{e.preventDefault();const name=input.value.trim();if(!name)return;const btn=form.querySelector('button');btn.disabled=true;btn.textContent='Researching…';result.classList.add('hidden');status.classList.remove('hidden');status.textContent='Researching public sources. This can take a minute.';try{const res=await fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const data=await res.json();if(!res.ok)throw Error(data.error||'Research unavailable');if(data.pending)throw Error(data.message||'Research in progress. Please retry shortly.');const a=data.analysis||{};const refs=(data.sources||[]).filter(x=>/^https?:\/\//.test(x.url));result.innerHTML=`<div class="top"><div><div class="eyebrow">Case study / ${esc(data.researchedAt?.slice(0,10)||'research')} · ${data.cached?'Cached result':'New research'}</div><h2>${esc(a.name||name)}</h2></div><div class="tag">${esc(a.confidence||'Evidence-limited')} confidence</div></div><p>${esc(a.identity||'')}</p><div class="cards">${scoreCard('01 / CULTURAL CONTRIBUTION',a.contributionScore,a.contributions)}${scoreCard('02 / DOCUMENTED ETHICAL RECORD',a.ethicsScore,a.ethics)}</div><section class="verdict" style="border-left-color:${color(Number(a.ethicsScore)||50)}"><div class="eyebrow">03 / The verdict</div><h3 style="color:#eae9e5">${esc(a.verdictTitle||'Consider the evidence')}</h3><p>${esc(a.verdict||'')}</p></section><section class="reflection"><div class="eyebrow">04 / Beyond the work</div><h3>What does our attention make possible?</h3><p>${esc(a.reflection||'')}</p></section><section class="reflection"><div class="eyebrow">05 / Sources</div><p>These links were returned by the live research tool. Read them to verify the claims; source presence does not guarantee that every claim is correct.</p>${refs.length?`<ol>${refs.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title||x.url)}</a></li>`).join('')}</ol>`:'<p>No independently linked sources were returned. Treat this analysis as unverified.</p>'}</section><p class="note">Scores are subjective editorial estimates, not objective measures of human worth. Allegations are not findings of guilt. Verify primary sources before sharing claims. ${data.cached?'Saved result':'New analysis'} · Research generated ${esc(data.researchedAt||'')} · Expires 24 hours after research.</p>`;status.classList.add('hidden');result.classList.remove('hidden');result.scrollIntoView({behavior:'smooth'});}catch(err){status.textContent=err.message;}finally{btn.disabled=false;btn.textContent='Examine →';}});
</script></body></html>
