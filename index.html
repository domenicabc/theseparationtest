<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Separation Test</title><style>
:root{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;color:#eae9e5;background:#101112}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:48px 22px 90px}.eyebrow{font-size:12px;letter-spacing:.19em;color:#a4a5a5;text-transform:uppercase}.hero{padding:40px 0 32px;border-bottom:1px solid #393b3d}h1{font-size:clamp(38px,8vw,94px);letter-spacing:.015em;line-height:1.06;margin:20px 0}h1 em{font-family:inherit;font-style:normal;font-weight:400;color:#d6d5d0}p{color:#b4b5b5;line-height:1.65;max-width:680px}.search{display:flex;gap:8px;margin-top:28px}input{background:#222426;border:1px solid #64676b;color:white;padding:17px;font-size:17px;border-radius:4px;flex:1;min-width:0}button{background:#eae9e5;color:#171819;border:0;border-radius:4px;padding:14px 22px;font-weight:700;cursor:pointer}button:hover{background:#ffffff}button:disabled{opacity:.6;cursor:wait} .reflection ol{padding-left:22px}.reflection li{margin:12px 0;overflow-wrap:anywhere} .reflection a{color:#deddd8}.hint{font-size:12px;color:#939598;margin-top:12px}.result{margin-top:40px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.top h2{font-size:42px;letter-spacing:.005em;line-height:1.18;margin:10px 0}.tag{border:1px solid #5b5e62;padding:8px 12px;border-radius:99px;color:#d6d6d4;font-size:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:25px 0}.card{border:1px solid #3a3d40;border-radius:7px;padding:25px;background:#1b1d1f}.card h3{margin:0 0 14px;font-size:15px}.score{font-size:64px;font-weight:750;letter-spacing:.025em;font-variant-numeric:tabular-nums lining-nums;line-height:1.2}.score small{font-size:19px;color:#939598;letter-spacing:.035em;font-weight:400}.bar{height:9px;background:#383b3e;border-radius:10px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;background:#659e79}.card li{margin:0 0 13px;color:#d0d0cd;line-height:1.5}.card ul{padding-left:19px}.verdict{background:#222426;padding:28px;border-left:4px solid #d9aa55;border-radius:4px}.verdict h3{color:#d9aa55;font-size:27px;margin:10px 0}.verdict p{margin-bottom:0}.reflection{margin-top:16px;border:1px solid #3a3d40;border-radius:5px;padding:26px 28px;background:#1b1d1f}.reflection h3{font-size:19px;font-weight:500;letter-spacing:.01em;margin:12px 0}.reflection p{margin:10px 0 0}.hidden{display:none}.note{margin-top:25px;font-size:12px;color:#939598}.error{border:1px solid #626569;border-radius:5px;padding:25px;margin-top:25px}a{color:#eae9e5}@media(max-width:680px){.cards{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.search{flex-direction:column}button{width:100%}}
</style></head><body><main><div class="eyebrow">An experiment in art, ethics & influence</div><section class="hero"><h1>“THE<br><em>SEPARATION</em><br>TEST”</h1><p>Can you separate the work from the person? Explore cultural contribution, documented ethical conduct, and what your support actually enables.</p><form class="search" id="search"><input id="name" placeholder="Search a public figure…" aria-label="Public figure's name" required><button>Examine →</button></form><div class="hint">Free public-source edition · Wikipedia search · No AI API required.</div></section><section id="status" class="error hidden" role="status"></section><section id="result" class="result hidden" aria-live="polite"></section></main>
<script>
const form=document.getElementById('search'),input=document.getElementById('name'),result=document.getElementById('result'),status=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wiki=(title)=>'https://en.wikipedia.org/wiki/'+encodeURIComponent(title.replace(/ /g,'_'));
const api='https://en.wikipedia.org/w/api.php?origin=*&format=json&formatversion=2&';
async function get(params){const r=await fetch(api+new URLSearchParams(params));if(!r.ok)throw Error('Wikipedia is temporarily unavailable. Please try again.');return r.json()}
function card(title,items,detail){return `<section class="card"><h3>${esc(title)}</h3><div class="score" style="color:#a4a5a5;font-size:35px">UNSCORED</div><p style="font-size:13px">${esc(detail)}</p><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`}
function sentences(text,max){return (text.match(/[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$/g)||[]).map(s=>s.trim()).filter(s=>s.length>35).slice(0,max)}
form.addEventListener('submit',async e=>{e.preventDefault();const name=input.value.trim();if(!name)return;const btn=form.querySelector('button');btn.disabled=true;btn.textContent='Searching…';result.classList.add('hidden');status.classList.remove('hidden');status.textContent='Looking up public information on Wikipedia…';try{
const search=await get({action:'query',list:'search',srsearch:name,srlimit:'5',srnamespace:'0'});const hits=search.query?.search||[];if(!hits.length)throw Error('No Wikipedia article found for that name. Try a fuller name or different spelling.');
const title=hits[0].title;const detail=await get({action:'query',prop:'extracts|info',inprop:'url',explaintext:'1',exintro:'1',titles:title,redirects:'1'});const page=detail.query?.pages?.[0];if(!page||page.missing)throw Error('Could not load a public profile.');
const intro=(page.extract||'').trim();const statements=sentences(intro,5);const article=page.fullurl||wiki(page.title||title);
const contributions=statements.length?statements:['The source does not provide enough information to summarize this person’s contributions.'];
const ethical=['A biographical summary is not sufficient evidence to assess a person’s morality.','This edition does not verify allegations, legal records, or competing accounts.','Positive and harmful conduct both require independently checked sources.','Absence of reported wrongdoing is not evidence of moral virtue.','No numerical ethical score is assigned without a transparent research process.'];
result.innerHTML=`<div class="top"><div><div class="eyebrow">Public-source profile / ${esc(new Date().toISOString().slice(0,10))}</div><h2>${esc(page.title||title)}</h2></div><div class="tag">Unscored · Source-limited</div></div><p>${esc(intro.slice(0,700)||'No introductory summary is available.')}</p><div class="cards">${card('01 / CULTURAL CONTRIBUTION',contributions,'Up to five statements from the Wikipedia introduction; not an independently verified ranking of significance.')}${card('02 / DOCUMENTED ETHICAL RECORD',ethical,'Insufficient verified evidence for a moral score.')}</div><section class="verdict" style="border-left-color:#777b80"><div class="eyebrow">03 / The verdict</div><h3 style="color:#eae9e5">No responsible verdict yet</h3><p>A single encyclopedia profile cannot establish whether supporting this person or their work is ethically responsible. Consider who receives money, attention and legitimacy from the specific action you are contemplating, and seek independent evidence before deciding.</p></section><section class="reflection"><div class="eyebrow">04 / Beyond the work</div><h3>What does our attention make possible?</h3><p>Attention is never entirely without consequence: it can sustain institutions, confer legitimacy, and shift what a culture is willing to overlook. Yet it can also preserve meaningful art, encourage positive action, and create space for critical engagement. The question is not only whether a work has value, but what our particular way of engaging with it helps sustain.</p></section><section class="reflection"><div class="eyebrow">05 / Sources</div><p><a href="${esc(article)}" target="_blank" rel="noopener noreferrer">Read the Wikipedia article for ${esc(page.title||title)}</a></p><p>Wikipedia is a starting point, not a complete fact-check. Follow its citations to primary sources before drawing ethical conclusions.</p>${hits.length>1?`<p>Looking for someone else? Other matches: ${hits.slice(1).map(h=>`<a href="${esc(wiki(h.title))}" target="_blank" rel="noopener noreferrer">${esc(h.title)}</a>`).join(' · ')}</p>`:''}</section><p class="note">This free version does not use OpenAI or generate AI verdicts. Its statements come from a third-party encyclopedia and may be incomplete or contested.</p>`;
status.classList.add('hidden');result.classList.remove('hidden');result.scrollIntoView({behavior:'smooth'});
}catch(err){status.textContent=err.message;}finally{btn.disabled=false;btn.textContent='Examine →';}});
</script></body></html>
